x-volumes: &dotfiles_and_app_dir
  - "${VIM_RC_FPATH}:/root/.vimrc" 
  - "${VIM_CONFIG_DIR}:/root/.vim/custom/"
  - "${PLUGINS_DIR}:/root/.vim/plugged"
  - "${HOST_APP_DIR}:/root/workspace"
  - "${BASH_HISTORY_FPATH}:/root/.bash_history"
  - "${COC_DATA_DIR}:/coc" 

x-build-args: &build-args
  args:
    BASE_IMAGE: ${BASE_IMAGE}
    DEV_IMAGE_NAME: ${DEV_IMAGE_NAME}
    DOTFILES_BASENAME: ${DOTFILES_BASENAME}
    DOCKSTATION_VERSION: ${DOCKSTATION_VERSION}

services:
  
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - rohailt/${DEV_IMAGE_NAME}-jupyter
      cache_to:
        - type=registry,ref=rohailt/${DEV_IMAGE_NAME}-jupyter
      <<: *build-args
      target: jupyter
    image: rohailt/${DEV_IMAGE_NAME}-jupyter
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
    working_dir: /root/workspace
    volumes: *dotfiles_and_app_dir 

  # useful for debugging
  # docker-compose --env-file .env -f /Users/rohailtaimour/home/2_AREAS/work/dockstation/docker-compose.yml build tools --no-cache
  tools: 
    build:
      context: .
      dockerfile: Dockerfile
      <<: *build-args
      target: tools
    image: rohailt/${DEV_IMAGE_NAME}-tools-debug
    working_dir: /root/workspace
    stdin_open: true
    environment:
      # where extensions are added
      XDG_CONFIG_HOME: /coc
    tty: true
    volumes: *dotfiles_and_app_dir
  bash: 
    build:
      context: .
      dockerfile: Dockerfile
      <<: *build-args
      target: bash
    image: rohailt/${DEV_IMAGE_NAME}-bash-debug
    working_dir: /root/workspace
    stdin_open: true
    environment:
      # where extensions are added
      XDG_CONFIG_HOME: /coc
    tty: true
    volumes: *dotfiles_and_app_dir

  vim: 
    build:
      context: .
      dockerfile: Dockerfile
      <<: *build-args
      cache_from:
        - rohailt/${DEV_IMAGE_NAME}-vim_plugins
      cache_to:
        - type=registry,ref=rohailt/${DEV_IMAGE_NAME}-vim_plugins
      target: vim_plugins
    image: rohailt/${DEV_IMAGE_NAME}-vim_plugins
    working_dir: /root/workspace
    stdin_open: true
    environment:
      # where extensions are added
      XDG_CONFIG_HOME: /coc
    tty: true
    volumes: *dotfiles_and_app_dir